name: neotrade
# Backend rebuilds+redeploys are automated: pushes to main that touch
# backend/** or this file trigger .github/workflows/deploy-backend.yml on the
# VM's self-hosted runner.
#
# Mongo and Redis are managed cloud services (Atlas + Upstash, same ones the
# Render deployment used). See MONGODB_URL/REDIS_URL in .env. Exception: the
# big market-data collections (daily_bars, news_history*) live in the `mongo`
# service below (backend/database.py::LOCAL_COLLECTIONS), since Atlas M0 caps
# at 512 MB. No host port: only these containers reach it.

services:
  backend:
    build:
      context: ./backend
      args:
        GIT_SHA: ${GIT_SHA:-}
    container_name: neotrade-backend
    restart: unless-stopped
    # The deploy workflow only names `backend`; this makes the same
    # `docker compose up -d --build backend` also (re)build and start ingest and jobs.
    # The API does not need it to serve -- it fetches itself on a cache miss.
    depends_on:
      - ingest
      - jobs
      - mongo
    environment: &backend-env
      MONGODB_URL: ${MONGODB_URL}
      LOCAL_MONGODB_URL: ${LOCAL_MONGODB_URL:-mongodb://mongo:27017}
      DATABASE_NAME: ${DATABASE_NAME:-stock_investor_db}
      REDIS_URL: ${REDIS_URL}
      OMNIROUTE_API_KEY: ${OMNIROUTE_API_KEY:-}
      OMNIROUTE_FEATURE_KEYS: ${OMNIROUTE_FEATURE_KEYS:-}  # JSON {feature: key}, Phase 17.2.5
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      JWT_SECRET: ${JWT_SECRET:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # Broker credentials are per-user and encrypted with this key; without
      # it the app refuses to store them rather than writing plaintext.
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # false: this process stops starting the background loops; `jobs` runs them (backend/jobs.py).
      RUN_BACKGROUND_JOBS: ${RUN_BACKGROUND_JOBS:-true}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    networks:
      - default
      - routineos_default
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Shared market/macro/news data layer (backend/datalayer/worker.py): same
  # image, no port. One instance works at a time (Redis leader lock).
  ingest:
    build:
      context: ./backend
    container_name: neotrade-ingest
    restart: unless-stopped
    command: ["python", "-m", "backend.datalayer.worker"]
    depends_on:
      - mongo
    environment: *backend-env
    networks:
      - default
      - routineos_default
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Background loops (backend/jobs.py): daily pass, autorun, order sweeps, guardrail
  # monitor, Telegram poller. Same image, no port. Set RUN_BACKGROUND_JOBS=false on
  # `backend` so the API stops starting them; the loops' own Redis locks keep it safe
  # while both run.
  jobs:
    build:
      context: ./backend
    container_name: neotrade-jobs
    restart: unless-stopped
    command: ["python", "-m", "backend.jobs"]
    depends_on:
      - mongo
    environment: *backend-env
    networks:
      - default
      - routineos_default
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # daily_bars + news_history* (see the header). Not backed up: bars refetch from Yahoo
  # (`bars` full pass), news_history from backfill_news (its LLM scores would cost quota again).
  mongo:
    image: mongo:8.0
    container_name: neotrade-mongo
    restart: unless-stopped
    command: ["--wiredTigerCacheSizeGB", "1"]
    volumes:
      - mongo-data:/data/db
    networks:
      - default
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mongo-data:

networks:
  default:
  routineos_default:
    external: true
