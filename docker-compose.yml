name: neotrade
# Backend rebuilds+redeploys are automated: pushes to main that touch
# backend/** or this file trigger .github/workflows/deploy-backend.yml on the
# VM's self-hosted runner.
#
# Mongo and Redis are managed cloud services (Atlas + Upstash, same ones the
# Render deployment used) -- not containers here. See MONGODB_URL/REDIS_URL
# in .env.

services:
  backend:
    build:
      context: ./backend
      args:
        GIT_SHA: ${GIT_SHA:-}
    container_name: neotrade-backend
    restart: unless-stopped
    # The deploy workflow only names `backend`; this makes the same
    # `docker compose up -d --build backend` also (re)build and start ingest.
    # The API does not need it to serve -- it fetches itself on a cache miss.
    depends_on:
      - ingest
    environment: &backend-env
      MONGODB_URL: ${MONGODB_URL}
      DATABASE_NAME: ${DATABASE_NAME:-stock_investor_db}
      REDIS_URL: ${REDIS_URL}
      OMNIROUTE_API_KEY: ${OMNIROUTE_API_KEY:-}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      JWT_SECRET: ${JWT_SECRET:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # Broker credentials are per-user and encrypted with this key; without
      # it the app refuses to store them rather than writing plaintext.
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    networks:
      - default
      - routineos_default
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Shared market/macro/news data layer (backend/datalayer/worker.py): same
  # image, no port. One instance works at a time (Redis leader lock).
  ingest:
    build:
      context: ./backend
    container_name: neotrade-ingest
    restart: unless-stopped
    command: ["python", "-m", "backend.datalayer.worker"]
    environment: *backend-env
    networks:
      - default
      - routineos_default
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
    container_name: neotrade-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

networks:
  default:
  routineos_default:
    external: true
