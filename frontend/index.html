  <body>
    <!--
      THESIS: This app is a broker's contract note kept live. It refuses the
      trading-dashboard arrangement of glass cards on a dark grid; figures sit
      in ruled columns and close under a double rule, the way a statement does.

      OWN-WORLD: Office-bond paper (#f4f4f1) under black ink, hairline rules,
      double rules under every net, square corners everywhere. Archivo Narrow
      in tracked caps for field labels, Courier Prime for machine-stamped
      document furniture, tabular figures throughout. One rubber-stamp violet
      (#3a32a0) carries authority and nothing else. Printed gain/loss ink, not
      screen neon. Dark mode is the carbon copy, not an inversion.

      STORY: The operator glances at a phone mid-session, reads the net, sees
      whether anything is awaiting a decision, and stamps it approved or
      declined.

      FIRST VIEWPORT: Note header with running number and date; today's net at
      figure scale closing under a double rule with the month beside it; then
      the awaiting-decision band as the primary action; then open positions as
      ruled rows.

      FORM: Contract note / broker statement — candidate 1 of the grounded
      list, chosen by the operator over the assigned roll. Seed key 69b9154f.

      FINISH: unreviewed and undocumented is unfinished; this build ends with
      the finish review, the verdict, DESIGN.md, and every shipping raster
      carrying its provenance.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
