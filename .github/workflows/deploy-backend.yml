name: Deploy backend

# Thin caller: the steps live in kushgarg132/ci-workflows (deploy-backend.yml),
# shared by every backend on the VM. It operates on the deploy clone at
# /home/ubuntu/deploys/NeoTrade (real .env there, gitignored) and skips when
# nothing matching `paths` changed. Run manually with force=true to rebuild
# regardless.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        type: boolean
        default: false

# Never cancel a deploy mid-`docker compose build`.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    uses: kushgarg132/ci-workflows/.github/workflows/deploy-backend.yml@main
    with:
      runner: neotrade
      deploy_dir: /home/ubuntu/deploys/NeoTrade
      branch: main
      sha: ${{ github.event.workflow_run.head_sha || github.sha }}
      force: ${{ inputs.force == true }}
      health_url: http://127.0.0.1:8000/
      container: neotrade-backend
